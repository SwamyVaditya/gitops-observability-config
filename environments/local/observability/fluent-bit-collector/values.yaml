# fluent-bit-collector runs as a DaemonSet (one pod per node), tailing
# /var/log/containers/*.log with CRI multiline parsing — this is the
# chart's default behavior out of the box.
#
# This chart GA'd March 2026 and its values schema may still be settling —
# confirm the keys below before relying on them:
#   helm repo add fluent https://fluent.github.io/helm-charts/
#   helm show values fluent/fluent-bit-collector --version 1.0.9
#
# IMPORTANT: it's unconfirmed whether `config.filters` REPLACES the
# chart's default filter chain or appends to it (same ambiguity we hit
# with `hostVolumes`). Written defensively either way: the `kubernetes`
# enrichment filter below is included explicitly so `kubernetes.namespace_name`
# exists for the `grep` filter to key on, whether or not the chart's own
# default kubernetes filter also runs.

# Destination host assumes the same OpenSearch Service name as
# opensearch-dashboards/values.yaml — confirm with
# `kubectl get svc -n observability` after opensearch first syncs, and
# correct `Host` below if the generated Service name differs.
config:
  inputs: |
    [INPUT]
      Name              tail
      Tag               kube.*
      # FIX 1: Broaden path so containerd/k3s logs are captured cleanly
      Path              /var/log/containers/*.log
      # FIX 2: Change parser to 'cri' because k3d uses containerd internally
      Parser            cri
      DB                /var/log/flb_kube.db
      Mem_Buf_Limit     50MB
      Skip_Long_Lines   On
      Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # FIX 3: Explicitly discard everything except your active workspace
    [FILTER]
        Name    grep
        Match   kube.*
        Regex   $kubernetes['namespace_name'] ^sampleapp$

  outputs: |
    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch-cluster-master
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     app-logs
        Suppress_Type_Name  On
        tls                 Off
        Replace_Dots        On


# FIX: Increase memory limits to prevent OOMKilled crash looping
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# FIX: Ensure standard Fluent Bit chart path volumes are correctly mapped
hostVolumes:
  - name: varlog
    mountPath: /var/log
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    hostPath:
      path: /var/lib/docker/containers

tolerations:
  - operator: Exists


# The chart's default hostVolumes mounts /etc/machine-id as a hostPath of
# type "File". k3d nodes are themselves just Docker containers, not real
# VMs/bare metal, and typically don't expose a real /etc/machine-id file at
# that path — the kubelet's existence check fails and the pod sticks in
# ContainerCreating indefinitely (see MountVolume.SetUp FailedMount events).
#
# Helm replaces list values wholesale rather than merging, so overriding
# hostVolumes here drops the machine-id mount entirely and keeps only the
# one that actually matters for log collection. machine-id is optional host
# metadata, not required for tailing container logs.
#hostVolumes:
#  - name: logs
#    mountPath: /var/log
#    hostPath:
#      path: /var/log
#      type: Directory

# Belt-and-suspenders: ensure the collector schedules onto every node
# (including a tainted control-plane, if any) so no node's logs are missed.
#tolerations:
#  - operator: Exists
