<text class="ts" x="730" y="406" text-anchor="middle" fill="#0F6E56">DaemonSet, all nodes</text>

<path d="M660 395 L640 330" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="620" y="380" fill="#5F5E5A">ships logs</text>

<rect x="80" y="550" width="260" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th t" x="210" y="573" text-anchor="middle">Traefik</text>
<text class="ts" x="210" y="591" text-anchor="middle" fill="#5F5E5A">ingress, ships with k3s</text>

<path d="M440 500 L340 580" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="345" y="530" fill="#5F5E5A">routes to</text>

<rect x="350" y="650" width="200" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th t" x="450" y="670" text-anchor="middle">Browser</text>
<text class="ts" x="450" y="688" text-anchor="middle" fill="#5F5E5A">opensearch-dashboards.local</text>

<path d="M210 610 L210 635 L410 635 L410 650" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

</svg>
